<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botmexico — En mantenimiento</title>
<link rel="icon" type="image/png" href="/static/assets/botmexico_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080a;
  --surface: rgba(14, 16, 20, 0.75);
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-gold: rgba(245, 158, 11, 0.25);
  --text: #f1f3f5;
  --text-dim: rgba(241, 243, 245, 0.55);
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.12);
  --font: 'Inter', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.bg-glow {
  position: fixed;
  top: 40%; left: 50%;
  transform: translate(-50%, -50%);
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.14) 0%, rgba(245, 158, 11, 0.02) 50%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.wrapper {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 440px;
  width: 90%;
  padding: 1rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-top: 1px solid var(--hairline-gold);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
}
.logo-container {
  margin-bottom: 1.75rem;
  display: flex;
  justify-content: center;
  align-items: center;
}
.logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.04); opacity: 0.85; }
}
h1 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
  color: #ffffff;
}
p {
  color: var(--text-dim);
  font-size: 0.92rem;
  line-height: 1.6;
  margin-bottom: 1.5rem;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 1.1rem;
  border-radius: 9999px;
  background: var(--amber-soft);
  border: 1px solid rgba(245, 158, 11, 0.25);
  color: var(--amber);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--amber);
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(0.85); }
}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrapper">
  <div class="card">
    <div class="logo-container">
      <img src="/static/assets/botmexico_logo.png" alt="Botmexico" class="logo">
    </div>
    <h1>Plataforma en Mantenimiento</h1>
    <p>Estamos realizando mejoras en la infraestructura para optimizar el rendimiento del sistema.<br>El acceso estará restablecido en breve.</p>
    <div class="status-badge">
      <span class="dot"></span>
      Actualización en Curso
    </div>
  </div>
</div>
</body>
</html>
