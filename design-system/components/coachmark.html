<!-- @dsCard group="Components" subtitle="Coachmarks, onboarding hints for admin" -->
<!-- Botmexico Design System — Coachmarks -->
<style>
  .ds-coach { display: flex; flex-direction: column; gap: 16px; padding: 16px; background: #08090c; border-radius: 12px; font-family: 'Inter', system-ui, sans-serif; }
  .ds-section { font-size: 9px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(238,240,243,0.34); font-family: 'JetBrains Mono', monospace; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .ds-cm { position: relative; width: 280px; background: linear-gradient(135deg, rgba(18,26,24,0.97), rgba(12,18,17,0.97)); border: 1px solid oklch(0.50 0.11 160); border-radius: 11px; padding: 13px 14px 11px; font-family: 'Space Grotesk', sans-serif; color: #eef0f3; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(96,250,178,0.18), 0 0 0 1px rgba(96,250,178,0.20); }
  .ds-cm::before { content: ''; position: absolute; width: 12px; height: 12px; background: linear-gradient(135deg, rgba(18,26,24,0.97), rgba(12,18,17,0.97)); border-left: 1px solid oklch(0.50 0.11 160); border-top: 1px solid oklch(0.50 0.11 160); top: -7px; left: 22px; transform: rotate(45deg); }
  .ds-cm-tip { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12px; color: oklch(0.50 0.11 160); margin-bottom: 6px; }
  .ds-cm-pill { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 999px; background: rgba(96,250,178,0.10); border: 1px solid rgba(96,250,178,0.25); color: oklch(0.50 0.11 160); text-transform: uppercase; }
  .ds-cm-text { font-size: 11.5px; line-height: 1.45; color: rgba(238,240,243,0.72); margin-bottom: 11px; }
  .ds-cm-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 9px; border-top: 1px dashed rgba(255,255,255,0.12); }
  .ds-cm-dismiss { display: flex; align-items: center; gap: 5px; font-size: 10px; font-family: 'JetBrains Mono', monospace; color: rgba(238,240,243,0.52); text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer; }
  .ds-cm-ok { background: oklch(0.50 0.11 160 / 0.14); border: 1px solid oklch(0.50 0.11 160); color: oklch(0.50 0.11 160); padding: 5px 13px; border-radius: 6px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 160ms; }
  .ds-cm-ok:hover { background: oklch(0.50 0.11 160); color: #07100d; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(96,250,178,0.30); }
</style>
<div class="ds-coach">
  <div class="ds-section">Coachmark (Admin hint)</div>
  <div class="ds-cm">
    <div class="ds-cm-tip">
      <span>💡</span> Tip de operación
      <span class="ds-cm-pill">admin</span>
    </div>
    <div class="ds-cm-text">
      Arrastra cuentas seleccionadas de la tabla al panel de depósitos para agregarlas a la misión multi-cuenta.
    </div>
    <div class="ds-cm-actions">
      <label class="ds-cm-dismiss"><input type="checkbox" style="accent-color:oklch(0.50 0.11 160)"> No mostrar</label>
      <button class="ds-cm-ok">Entendido</button>
    </div>
  </div>
  <div style="font-size:9px;color:rgba(238,240,243,0.34);font-family:'JetBrains Mono',monospace">
    Glass surface verde-oscuro + pulse glow + arrow CSS. Entrance: spring bounce 380ms. z-index: 10000.
  </div>
</div>
