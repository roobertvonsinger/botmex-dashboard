<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botmexico — En mantenimiento</title>
<link rel="icon" type="image/png" href="/static/assets/botmexico_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090c;
  --surface: rgba(18, 20, 24, 0.70);
  --hairline: rgba(255,255,255,0.07);
  --text: #eef0f3;
  --text-dim: rgba(238,240,243,0.58);
  --accent: oklch(0.78 0.20 169);
  --accent-soft: oklch(0.78 0.20 169 / 0.12);
  --warn: oklch(0.80 0.16 75);
  --warn-soft: oklch(0.80 0.16 75 / 0.12);
  --font: 'Inter', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.wrapper {
  text-align: center;
  max-width: 480px;
  padding: 2rem;
}
.icon {
  font-size: 4rem;
  margin-bottom: 1.5rem;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.95); }
}
h1 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.75rem;
  background: linear-gradient(135deg, var(--warn) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
p {
  color: var(--text-dim);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 1rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  padding: 2rem 2.5rem;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.status-bar {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 1rem;
  border-radius: 20px;
  background: var(--warn-soft);
  color: var(--warn);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  margin-top: 1.5rem;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--warn);
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.bg-glow {
  position: fixed;
  top: 30%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, oklch(0.40 0.16 75 / 0.10), transparent 70%);
  pointer-events: none;
  z-index: -1;
}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrapper">
  <div class="card">
    <div class="icon">&#128679;</div>
    <h1>En mantenimiento</h1>
    <p>El sistema se encuentra en mantenimiento programado.<br>Vuelve en un momento.</p>
    <div class="status-bar">
      <span class="dot"></span>
      Trabajando en ello
    </div>
  </div>
</div>
</body>
</html>
